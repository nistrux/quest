<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переводчик в азбуку Морзе</title>
    <style>
        /* --- Общие стили и сброс --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111827; /* Темно-синий фон */
            color: #d1d5db; /* Светло-серый текст */
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* --- Основной контейнер --- */
        .main-container {
            width: 100%;
            max-width: 672px; /* max-w-2xl */
            background-color: #1f2937; /* bg-gray-800 */
            border-radius: 16px; /* rounded-2xl */
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            padding: 24px;
            border: 1px solid #374151; /* border-gray-700 */
        }

        /* --- Типография --- */
        h1 {
            font-size: 30px;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 4px 0;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 16px 0;
            text-align: center;
        }
        p {
            margin: 0;
        }
        .subtitle {
            color: #9ca3af; /* text-gray-400 */
            margin-top: 4px;
        }

        /* --- Структура и отступы --- */
        .text-center { text-align: center; }
        .space-y-6 > * + * { margin-top: 24px; }
        .space-y-4 > * + * { margin-top: 16px; }
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .gap-4 { gap: 16px; }

        /* --- Элементы формы --- */
        fieldset {
            border: 1px solid #374151; /* border-gray-700 */
            border-radius: 8px;
            padding: 16px;
        }
        legend {
            padding: 0 8px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #9ca3af; /* text-gray-400 */
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            background-color: #111827; /* bg-gray-900 */
            border: 1px solid #374151; /* border-gray-700 */
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            color: #ffffff;
            resize: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #4f46e5; /* indigo-600 */
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.5);
        }
        button {
            width: 100%;
            padding: 8px 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5; /* bg-indigo-600 */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4338ca; /* hover:bg-indigo-700 */
        }

        /* --- Блоки вывода и информации --- */
        .output-box {
            width: 100%;
            background-color: #111827; /* bg-gray-900 */
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            font-size: 16px;
            min-height: 80px;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .text-green { color: #4ade80; }
        .info-box {
            background-color: #374151; /* bg-gray-700 */
            padding: 16px;
            border-radius: 8px;
        }
        .info-box .label {
            font-size: 14px;
            font-weight: 500;
            color: #9ca3af;
        }
        .info-box .value {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
        }
        .info-box .formula {
            font-size: 12px;
            font-family: monospace;
            color: #9ca3af;
            margin-top: 4px;
        }
        .warning-text {
            font-size: 12px;
            color: #facc15; /* yellow-500 */
            margin-top: 4px;
            height: 16px;
        }

        /* --- Таблица алфавита --- */
        .alphabet-grid {
            display: grid;
            gap: 8px;
            text-align: center;
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .alphabet-cell {
            background-color: #374151; /* bg-gray-700 */
            padding: 8px;
            border-radius: 8px;
        }
        .alphabet-cell .char {
            font-weight: 700;
            font-size: 18px;
            color: #ffffff;
        }
        .alphabet-cell .morse {
            font-family: monospace;
            font-size: 14px;
            color: #9ca3af;
        }
        .alphabet-cell.digit {
            background-color: #4b5563; /* bg-gray-600 */
        }
        .alphabet-cell.digit .morse {
            color: #d1d5db;
        }

        /* --- Адаптивность --- */
        @media (min-width: 768px) {
            .md-grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .sm-grid-cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
            .main-container { padding: 32px; }
        }

        /* Стили для кастомного скроллбара */
        textarea::-webkit-scrollbar, .output-box::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track, .output-box::-webkit-scrollbar-track {
            background: #111827;
        }
        textarea::-webkit-scrollbar-thumb, .output-box::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 20px;
            border: 2px solid #111827;
        }
    </style>
</head>
<body>

<div class="main-container space-y-6">

    <div class="text-center">
        <h1>Переводчик в азбуку Морзе</h1>
        <p class="subtitle">Поддерживает кириллицу и цифры</p>
    </div>

    <fieldset>
        <legend>Текст → Морзе</legend>
        <div class="space-y-4">
            <div>
                <label for="inputText">Исходный текст:</label>
                <textarea id="inputText" rows="4" placeholder="Текст для шифрования..."></textarea>
                <div id="invalidCharsWarning" class="warning-text"></div>
            </div>
            <div>
                <label for="outputText">Результат (Морзе):</label>
                <div id="outputText" class="output-box text-green"></div>
            </div>
        </div>
    </fieldset>

    <div class="grid grid-cols-1 md-grid-cols-2 gap-4 text-center">
        <div class="info-box">
            <p class="label">Символов в тексте (валидных)</p>
            <p id="inputCount" class="value">0</p>
            <p class="formula">&nbsp;</p> <!-- Пустой для выравнивания -->
        </div>
        <div class="info-box">
            <p class="label">Расчетная длина (в ед.)</p>
            <p id="morseLength" class="value">0</p>
            <p class="formula">(стежок=1, разделитель=2)</p>
        </div>
    </div>

    <fieldset>
        <legend>Морзе → Текст</legend>
        <div class="space-y-4">
            <div>
                <label for="morseInput">Код Морзе (разделитель /):</label>
                <textarea id="morseInput" rows="4" class="text-green" placeholder="- / . / ... / -"></textarea>
            </div>
            <button id="decodeButton">Расшифровать</button>
            <div>
                <label for="decodedOutput">Результат (Текст):</label>
                <div id="decodedOutput" class="output-box"></div>
            </div>
        </div>
    </fieldset>

    <div style="padding-top: 24px; margin-top: 24px; border-top: 1px solid #374151;">
        <h2>Алфавит Морзе</h2>
        <div id="alphabet-grid-container" class="alphabet-grid sm-grid-cols-6">
            <!-- Контент будет сгенерирован JS -->
        </div>
    </div>

</div>

<script>
    const morseCodeMap = {
        'А': '.-', 'Б': '-...', 'В': '.--', 'Г': '--.', 'Д': '-..', 'Е': '.', 'Ё': '.', 'Ж': '...-', 'З': '--..', 'И': '..', 'Й': '.---', 'К': '-.-', 'Л': '.-..', 'М': '--', 'Н': '-.', 'О': '---', 'П': '.--.', 'Р': '.-.', 'С': '...', 'Т': '-', 'У': '..-', 'Ф': '..-.', 'Х': '....', 'Ц': '-.-.', 'Ч': '---.', 'Ш': '----', 'Щ': '--.-', 'Ъ': '.--.-.', 'Ы': '-.--', 'Ь': '-..-', 'Э': '..-..', 'Ю': '..--', 'Я': '.-.-',
        '1': '.----', '2': '..---', '3': '...--', '4': '....-', '5': '.....', '6': '-....', '7': '--...', '8': '---..', '9': '----.', '0': '-----'
    };

    const reverseMorseMap = {};
    for (const key in morseCodeMap) {
        const value = morseCodeMap[key];
        if (!reverseMorseMap[value]) {
            reverseMorseMap[value] = key;
        }
    }

    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const inputCount = document.getElementById('inputCount');
    const morseLength = document.getElementById('morseLength');
    const invalidCharsWarning = document.getElementById('invalidCharsWarning');
    const morseInput = document.getElementById('morseInput');
    const decodeButton = document.getElementById('decodeButton');
    const decodedOutput = document.getElementById('decodedOutput');
    const alphabetGridContainer = document.getElementById('alphabet-grid-container');

    const LETTER_SEPARATOR = ' / ';
    const INVALID_CHARS_REGEX = /[^А-ЯЁ0-9]/gi;

    function renderAlphabet() {
        let html = '';
        const chars = Object.keys(morseCodeMap).filter(char => char !== 'Ё').sort((a, b) => {
            const isADigit = !isNaN(parseInt(a));
            const isBDigit = !isNaN(parseInt(b));
            if (isADigit && !isBDigit) return 1;
            if (!isADigit && isBDigit) return -1;
            return a.localeCompare(b, 'ru');
        });

        for (const char of chars) {
            const isDigit = !isNaN(parseInt(char));
            html += `
                    <div class="alphabet-cell ${isDigit ? 'digit' : ''}">
                        <p class="char">${char}</p>
                        <p class="morse">${morseCodeMap[char]}</p>
                    </div>
                `;
        }
        alphabetGridContainer.innerHTML = html;
    }

    function translateToMorse() {
        const originalText = inputText.value;
        const upperText = originalText.toUpperCase();

        const invalidChars = {};
        for(const char of upperText) {
            if (char.trim() === '') continue;
            if (!morseCodeMap[char]) {
                invalidChars[char] = (invalidChars[char] || 0) + 1;
            }
        }

        const cleanText = upperText.replace(/[^А-ЯЁ0-9]/g, '');

        const morseChars = [];
        for (const char of cleanText) {
            if (morseCodeMap[char]) {
                morseChars.push(morseCodeMap[char]);
            }
        }
        const morseString = morseChars.join(LETTER_SEPARATOR);
        outputText.textContent = morseString;

        inputCount.textContent = cleanText.length;

        // Расчет длины по формуле: (все точки и тире) + (количество_разделителей * 2)
        const dotDashCount = morseChars.reduce((sum, code) => sum + code.length, 0);
        const separatorCount = morseChars.length > 0 ? morseChars.length - 1 : 0;
        const separatorCost = 2;
        const totalLength = dotDashCount + (separatorCount * separatorCost);
        morseLength.textContent = totalLength;

        const invalidEntries = Object.entries(invalidChars);
        if (invalidEntries.length > 0) {
            invalidCharsWarning.textContent = 'Неподходящие символы: ' + invalidEntries.map(([char, count]) => `${count}x"${char}"`).join(', ');
        } else {
            invalidCharsWarning.textContent = '';
        }
    }

    function decodeFromMorse() {
        const cleanedMorseText = morseInput.value.replace(/[^.\-\s/]/g, '').trim();
        morseInput.value = cleanedMorseText;

        if (!cleanedMorseText) {
            decodedOutput.textContent = '';
            return;
        }
        const morseChars = cleanedMorseText.split(/\s*\/\s*/);
        const decodedText = morseChars.map(code => reverseMorseMap[code.trim()] || '?').join('');
        decodedOutput.textContent = decodedText;
    }

    document.addEventListener('DOMContentLoaded', () => {
        inputText.addEventListener('input', translateToMorse);
        decodeButton.addEventListener('click', decodeFromMorse);

        renderAlphabet();
        translateToMorse();
        decodeFromMorse();
    });
</script>

</body>
</html>
