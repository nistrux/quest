<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Quest</title>
    <script src="./mind-ar-js/aframe.min.js"></script>
    <script src="./mind-ar-js/mindar-image-aframe.prod.1.2.5.js"></script>
    <script src="./mind-ar-js/aframe-extras.min.js"></script>
    <script src="./mind-ar-js/aframe-text-geometry-component.min.js"></script>

    <!--<link rel="stylesheet" href="../../css/style.css">-->
    <link rel="stylesheet" href="./ar-style.css">
</head>
<body>
<div class="ar-container">
    <a-scene mindar-image="imageTargetSrc: ./assets/targets_triangle.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <!-- ОБЪЁМНЫЙ 3D ТЕКСТ -->
            <a-entity
                    text-geometry="value: SECRET; font: ./mind-ar-js/helvetiker_bold.typeface.json; size: 0.1; height: 0.05;"
                    material="color: #FFD700;"
                    position="-0.25 0.01 0"
                    rotation="-90 0 0">
            </a-entity>

        </a-entity>
    </a-scene>
</div>
<script src="./ar-app.js" defer></script>
</body>
</html>
