<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Quest</title>
    <script src="./mind-ar-js/aframe.min.js"></script>
    <script src="./mind-ar-js/mindar-image-aframe.prod.1.2.5.js"></script>

    <!--<link rel="stylesheet" href="../../css/style.css">-->
    <link rel="stylesheet" href="./ar-style.css">
</head>
<body>
<div class="ar-container">
    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <a-text
                    value="SECRET KEY"
                    color="#FFD700"
                    align="center"
                    width="10"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    scale="0.8 0.8 0.8">
            </a-text>

        </a-entity>
    </a-scene>
</div>
<script src="./ar-app.js" defer></script>
</body>
</html>
