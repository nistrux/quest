<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Quest</title>
    <script src="./mind-ar-js/aframe.min.js"></script>
    <script src="./mind-ar-js/mindar-image-aframe.prod.1.2.5.js"></script>
    <script src="./mind-ar-js/aframe-extras.min.js"></script>
    <script src="./mind-ar-js/aframe-troika-text.min.js"></script>

    <!--<link rel="stylesheet" href="../../css/style.css">-->
    <link rel="stylesheet" href="./ar-style.css">
</head>
<body>
<div class="ar-container">
    <a-scene mindar-image="imageTargetSrc: ./assets/cipher-disk-scale-11.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <a-entity mindar-image-target="targetIndex: 0">

                <!-- Родительский контейнер для анимации, который висит над маркером -->
                <a-entity position="0 0.03 0">
                    <!-- Анимация применяется к этому родительскому контейнеру -->
                    <a-animation
                            attribute="rotation"
                            to="0 360 0"
                            dur="8000"
                            easing="linear"
                            repeat="indefinite">
                    </a-animation>

                    <!-- Сам текст, который теперь просто дочерний элемент -->
                    <a-entity
                            troika-text="value: СЕКРЕТ; color: #0044DA align: center; fontSize: 0.2; anchor: center;">
                    </a-entity>
                </a-entity>

            </a-entity>
    </a-scene>
</div>
<script src="./ar-app.js" defer></script>
</body>
</html>
