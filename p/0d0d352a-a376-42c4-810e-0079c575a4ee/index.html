<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструмент шифрования</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="tool-container">
    <h1>Инструменты</h1>

    <div class="input-group">
        <label for="alphabet-input">Алфавит шифрования:</label>
        <input type="text" id="alphabet-input" value="АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ">
    </div>

    <fieldset class="cipher-block">
        <legend>Шифровка и анализ</legend>

        <div class="input-group">
            <label for="plain-text">Текст:</label>
            <textarea id="plain-text" rows="5"></textarea>
            <p id="char-warning" class="warning-text" style="display: none;"></p>
        </div>

        <div class="input-group">
            <label for="cipher-text">Шифротекст:</label>
            <textarea id="cipher-text" rows="5"></textarea>
        </div>

        <div class="input-group">
            <label for="key-text">Ключ:</label>
            <textarea id="key-text" rows="2"></textarea>
        </div>

        <div class="button-group">
            <button id="encrypt-btn">Зашифровать</button>
            <button id="decrypt-btn">Расшифровать</button>
            <button id="generate-key-btn">Сгенерировать ключ</button>
            <button id="find-key-btn">Подобрать ключ</button>
        </div>
    </fieldset>

</main>

<script src="tool.js"></script>
</body>
</html>
