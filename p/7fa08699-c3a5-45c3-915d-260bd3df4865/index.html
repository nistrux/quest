<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Загадка</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body {
            background-color: #2B2B2B;
            color: #A9B7C6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
        }

        #riddle-container {
            width: 100%;
            max-width: 500px;
            background-color: #3c3f41;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        #riddle-container h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #FFC66D;
        }

        #riddle-container p {
            margin-bottom: 1rem;
        }

        .timer-container #countdown-timer {
            font-size: 2.5rem;
            font-weight: bold;
            color: #A9B7C6;
            letter-spacing: 2px;
            margin: 1rem 0;
        }

        .timer-container #unlock-date {
            font-size: 0.9rem;
            color: #888;
        }

        .answer-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .answer-form input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid #555;
            background-color: #45494a;
            color: #A9B7C6;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .answer-form input[type="text"]:focus {
            outline: none;
            border-color: #6A87C3;
            box-shadow: 0 0 0 3px rgba(106, 135, 195, 0.4);
        }

        .answer-form button {
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #6A87C3;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .answer-form button:hover {
            background-color: #5873a7;
        }

        .answer-form button:active {
            transform: scale(0.98);
        }

        .answer-form button.loading {
            background-color: #555;
            cursor: wait;
        }

        /* Контейнер для фидбека (ошибок) */
        #feedback-container {
            margin-top: 1rem;
            min-height: 24px;
        }

        .feedback-message.error {
            color: #FF6B6B;
            font-weight: bold;
        }

        .unlocked-content h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #6A87C3;
        }

        .unlocked-content a {
            color: #82aee4;
            font-weight: bold;
            text-decoration: none;
        }
        .unlocked-content a:hover {
            text-decoration: underline;
        }

        @media (min-width: 400px) {
            .answer-form {
                flex-direction: row;
            }
        }

    </style>
</head>
<body>

<div id="riddle-container">
    <p>Загрузка задания...</p>
</div>

<script src="riddle.prod.js" defer></script>
<!--<script src="riddle.dev.js" defer></script>-->

</body>
</html>
